[project]
name = "hackathon-team3-retailmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "data-designer-github>=0.1.0",
    "glazed-retail-mcp",
    "langchain-core>=1.7.0",
]

[project.scripts]
hackathon-team3-retailmcp = "hackathon_team3_retailmcp:main"

[[tool.uv.index]]
url = "https://nvidia-nemo.github.io/DataDesignerPlugins/simple/"

[tool.uv.sources]
glazed-retail-mcp = { path = "src/mcp", editable = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
